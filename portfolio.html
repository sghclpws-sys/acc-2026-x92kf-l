<!-- ══════════ STEP 0 · TDF look-through 방어 강화 ══════════
     기존 코드는 h.id 매칭 + asset_type/asset_class === 'fund' 를 동시에 요구했다.
     portfolio.json v2.1에서 이 필드들이 빠지면서 분해가 조용히 중단됐다.
     JSON의 _tdf_equity_ratio → id → 종목명 순으로 폴백하도록 바꾼다.        -->
<script>
const TDF_LOOKTHROUGH = {
  tdf2055:            { equity_global: 0.85, bond_us: 0.15 },
  irp_tdf2050_mirae:  { equity_global: 0.80, bond_us: 0.20 },
  irp_tdf2050_hanwha: { equity_global: 0.80, bond_us: 0.20 },
};
const TDF_LOOKTHROUGH_BY_NAME = {
  'TDF2055': { equity_global: 0.85, bond_us: 0.15 },
  'TDF2050': { equity_global: 0.80, bond_us: 0.20 },
};

// JSON 명시비율 → id 매핑 → 종목명 부분일치 순으로 탐색
function getTdfRatio(h) {
  if (h._tdf_equity_ratio != null && h._tdf_bond_ratio != null) {
    return { equity_global: Number(h._tdf_equity_ratio), bond_us: Number(h._tdf_bond_ratio) };
  }
  if (h.id && TDF_LOOKTHROUGH[h.id]) return TDF_LOOKTHROUGH[h.id];
  const name = h.name || '';
  for (const key in TDF_LOOKTHROUGH_BY_NAME) {
    if (name.indexOf(key) !== -1) return TDF_LOOKTHROUGH_BY_NAME[key];
  }
  return null;
}

function expandTdfLookthrough(assets) {
  const result = [];
  (assets || []).forEach(function(h) {
    const lt = getTdfRatio(h);
    if (lt) {
      Object.entries(lt).forEach(function(entry) {
        result.push(Object.assign({}, h, {
          asset_class: entry[0],
          amount: h.amount * entry[1],
          _tdf_source: h.name
        }));
      });
    } else {
      result.push(h);
    }
  });
  return result;
}
</script>

<!-- ══════════ STEP 2 · renderTAASignalPanel 전체 교체 ══════════ -->
<script>
let TAA = null;

const TAA_AXES = [
  { key:'valuation', label:'밸류에이션', desc:'ERP·금리레벨·실질금리' },
  { key:'trend',     label:'추세',       desc:'200일 이동평균 대비 위치' },
  { key:'credit',    label:'신용',       desc:'HY OAS 레벨·4주 변화' },
  { key:'cycle',     label:'사이클',     desc:'10y-3m 커브·실업수당 4주평균' },
  { key:'sentiment', label:'심리',       desc:'VIX' },
];
const TAA_ASSET_ORDER = ['equity_global','equity_kr','bond_us','gold','oil','crypto'];

async function loadTAAScorecard() {
  const token = getToken(), cfg = getRepoConfig();
  if (!token || !cfg.owner || !cfg.repo) return null;
  try {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/taa_scorecard.json`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } });
    if (!res.ok) return null;
    const json = await res.json();
    TAA = JSON.parse(decodeURIComponent(escape(atob(json.content.replace(/\n/g, '')))));
    return TAA;
  } catch (e) {
    console.warn('[TAA] scorecard load failed:', e);
    return null;
  }
}

function taaScoreCell(v) {
  if (v === null || v === undefined) return '<span style="color:var(--text3);font-weight:600">—</span>';
  const col = v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--text3)';
  const bg  = v > 0 ? 'var(--green-l)' : v < 0 ? 'var(--red-l)' : 'var(--bg)';
  return '<span style="display:inline-block;min-width:26px;padding:2px 6px;border-radius:6px;background:'
       + bg + ';color:' + col + ';font-weight:800;font-size:11px">' + (v > 0 ? '+' : '') + v + '</span>';
}

function taaBiasPill(bias, triggered) {
  const map = {
    OVERWEIGHT:        ['비중확대',  'var(--green)', 'var(--green-l)'],
    SLIGHT_OVERWEIGHT: ['소폭확대',  'var(--green)', 'var(--green-l)'],
    NEUTRAL:           ['중립',      'var(--text3)', 'var(--bg)'],
    SLIGHT_UNDERWEIGHT:['소폭축소',  'var(--red)',   'var(--red-l)'],
    UNDERWEIGHT:       ['비중축소',  'var(--red)',   'var(--red-l)'],
    FROZEN:            ['동결',      'var(--orange)','var(--orange-l)'],
  };
  const m = map[bias] || map.NEUTRAL;
  return '<span style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:'
       + m[2] + ';color:' + m[1] + '">' + m[0] + (triggered ? ' ★' : '') + '</span>';
}

function renderTAASignalPanel() {
  const el = document.getElementById('taaSignalPanel');
  const badge = document.getElementById('taa-updated-badge');
  if (!el) return;
  if (!TAA || !TAA.scorecard || !TAA.scorecard.assets) { renderTAALegacyPanel(); return; }

  const sc = TAA.scorecard, assets = sc.assets || {}, inp = sc.inputs || {};
  if (badge) badge.textContent = 'updated ' + (TAA.updated_at || '-').slice(0, 16).replace('T', ' ');

  const fired = Object.values(assets).filter(function(a) { return a.triggered; }).length;
  const bColor = fired ? 'var(--accent)' : 'var(--text2)';
  const bBg    = fired ? 'var(--accent-l)' : 'var(--bg)';
  const bText  = fired ? fired + '개 자산군에서 복수 축 동조 — 신규자금 배분 순서 조정 후보'
                       : '동조 축 부족 — SAA 배분 순서 유지';

  let html = '<div style="padding:10px 14px;border-radius:8px;background:' + bBg
    + ';margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px">'
    + '<span style="font-size:12px;font-weight:700;color:' + bColor + '">' + bText + '</span>'
    + '<span style="font-size:10px;color:var(--text3)">발동조건 ' + (sc.trigger_rule || '') + '</span></div>';

  const cols = '112px repeat(5, minmax(0,1fr)) 54px 46px 82px';
  html += '<div style="overflow-x:auto"><div style="min-width:660px">';
  html += '<div style="display:grid;grid-template-columns:' + cols + ';gap:6px;padding:0 8px 7px;'
        + 'border-bottom:2px solid var(--border);font-size:10px;font-weight:800;color:var(--text3)">'
        + '<span>자산군</span>'
        + TAA_AXES.map(function(a) { return '<span style="text-align:center" title="' + a.desc + '">' + a.label + '</span>'; }).join('')
        + '<span style="text-align:center">총점</span><span style="text-align:center">동조</span>'
        + '<span style="text-align:right">판단</span></div>';

  TAA_ASSET_ORDER.forEach(function(k) {
    const s = assets[k];
    if (!s) return;
    const col = CLS_COLOR[k] || '#9ca3af';
    const tCol = s.total > 0 ? 'var(--green)' : s.total < 0 ? 'var(--red)' : 'var(--text3)';
    html += '<div style="display:grid;grid-template-columns:' + cols + ';gap:6px;align-items:center;padding:8px;'
          + 'border-bottom:1px solid var(--border);background:' + (s.triggered ? 'var(--accent-l)' : 'transparent') + ';border-radius:6px">'
          + '<span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700">'
          + '<span style="width:8px;height:8px;border-radius:50%;background:' + col + ';flex-shrink:0"></span>'
          + (ASSET_LABEL_KO[k] || k) + '</span>'
          + TAA_AXES.map(function(a) { return '<span style="text-align:center">' + taaScoreCell(s.axes[a.key]) + '</span>'; }).join('')
          + '<span style="text-align:center;font-size:13px;font-weight:850;color:' + tCol + '">' + (s.total > 0 ? '+' : '') + s.total + '</span>'
          + '<span style="text-align:center;font-size:11px;color:var(--text2);font-weight:700">' + s.agree_count + '/' + s.axes_available + '</span>'
          + '<span style="text-align:right">' + taaBiasPill(s.bias, s.triggered) + '</span></div>';
  });
  html += '</div></div>';

  const f = function(v, d, sfx) { return (v === null || v === undefined) ? '—' : Number(v).toFixed(d) + (sfx || ''); };
  const cards = [
    ['Forward ERP', f(inp.erp, 2, '%p')], ['CAPE', f(inp.cape, 1)], ['VIX', f(inp.vix, 1)],
    ['US10Y', f(inp.us10y, 2, '%')], ['실질금리', f(inp.real_rate, 2, '%')],
    ['HY OAS', f(inp.hy_oas, 2, '%')], ['HY 4주변화', f(inp.hy_chg, 2, '%p')],
    ['10y-3m 커브', f(inp.curve, 2, '%p')], ['실업수당 4주', f(inp.claims_chg, 1, '%')],
    ['USD/KRW', inp.usd_krw ? Math.round(inp.usd_krw).toLocaleString() : '—'],
  ];
  html += '<div style="margin-top:12px"><div style="font-size:10px;font-weight:800;color:var(--text3);'
        + 'text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">축 입력값 · 밸류/신용/사이클/심리</div>'
        + '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">'
        + cards.map(function(c) {
            return '<div style="padding:7px 9px;background:var(--bg);border-radius:7px">'
                 + '<div style="font-size:9px;color:var(--text3);font-weight:700;margin-bottom:2px">' + c[0] + '</div>'
                 + '<div style="font-size:12px;font-weight:800">' + c[1] + '</div></div>';
          }).join('') + '</div></div>';

  // 추세 축 원시값 — 200일선 대비 위치 (점수만이 아니라 실제 %와 데이터 출처까지 표시)
  var tin = sc.trend_inputs || {};
  var traw = sc.trend_raw || {};
  var trendCards = TAA_ASSET_ORDER.filter(function(k) { return tin[k] != null; }).map(function(k) {
    var v = Number(tin[k]);
    var col = v > 0 ? 'var(--green)' : v < 0 ? 'var(--red)' : 'var(--text3)';
    var src = (traw[k] && traw[k].source) ? traw[k].source : '';
    var stale = (traw[k] && traw[k].is_stale) ? ' <span style="color:var(--yellow)">stale</span>' : '';
    return '<div style="padding:7px 9px;background:var(--bg);border-radius:7px">'
         + '<div style="font-size:9px;color:var(--text3);font-weight:700;margin-bottom:2px">'
         + (ASSET_LABEL_KO[k] || k) + stale + '</div>'
         + '<div style="font-size:12px;font-weight:800;color:' + col + '">' + (v > 0 ? '+' : '') + v.toFixed(1) + '%</div>'
         + (src ? '<div style="font-size:8px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + src + '</div>' : '')
         + '</div>';
  }).join('');
  if (trendCards) {
    html += '<div style="margin-top:10px"><div style="font-size:10px;font-weight:800;color:var(--text3);'
          + 'text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">축 입력값 · 추세 (200일선 대비)</div>'
          + '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">' + trendCards + '</div></div>';
  }

  // 참고 지표 — 수집만 하고 스코어에는 반영하지 않는 항목
  var refs = sc.reference_inputs || [];
  if (refs.length) {
    var refRows = refs.map(function(r) {
      return '<div style="display:grid;grid-template-columns:150px 92px 1fr;gap:8px;align-items:baseline;'
           + 'padding:6px 8px;border-bottom:1px solid var(--border);font-size:11px">'
           + '<span style="font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + r.label + '</span>'
           + '<span style="text-align:right;font-weight:850;font-size:12px">' + r.display + '</span>'
           + '<span style="color:var(--text3);font-size:10px;line-height:1.5">'
           + (r.source ? '<b style="color:var(--text2)">' + r.source + '</b> · ' : '') + (r.note || '') + '</span>'
           + '</div>';
    }).join('');
    html += '<div style="margin-top:14px">'
          + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
          + '<span style="font-size:10px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.4px">참고 지표</span>'
          + '<span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;background:var(--bg);color:var(--text3)">스코어 미반영</span>'
          + '<span style="font-size:10px;color:var(--text3)">' + refs.length + '개 · 축 확장 및 교차검증용</span></div>'
          + '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:4px 6px">' + refRows + '</div></div>';
  }

  html += '<div style="margin-top:12px;padding:9px 13px;background:var(--yellow-l);border-radius:7px;'
        + 'font-size:11px;color:var(--text2);line-height:1.7;border-left:3px solid var(--yellow)">'
        + '<b>읽는 법</b> · 총점보다 축별 점수를 먼저 본다. 밸류에이션이 나빠도 추세·신용이 우호적이면 상충 구간이므로 '
        + 'SAA를 그대로 유지한다. 발동(★)은 신규자금 배분 순서만 바꾸며 보유분 매도는 어떤 점수에서도 트리거하지 않는다. '
        + '추세 축은 -1~+1로 폭이 좁게 설계돼 있어 밸류에이션·심리(평균회귀)와 방향이 자주 엇갈린다.</div>';

  el.innerHTML = html;
}

function renderTAALegacyPanel() {
  var el = document.getElementById('taaSignalPanel'), badge = document.getElementById('taa-updated-badge');
  if (!el || !P) return;
  var ma = P.macro_assumptions || {};
  if (badge) badge.textContent = 'macro_assumptions ' + (ma.updated_at || '-');
  function sig(l, c, b) { return '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:' + b + ';color:' + c + '">' + l + '</span>'; }
  var cape = ma.cape, vix = ma.vix, erp = ma.forward_erp, t10 = ma.us10y;
  var rows = [
    { label:'CAPE (Shiller PE)', val: cape != null ? cape.toFixed(2) : '-',
      signal: cape == null ? '-' : cape >= 38 ? sig('과열','var(--red)','var(--red-l)') : cape >= 28 ? sig('고평가','var(--orange)','var(--orange-l)') : sig('중립','var(--text2)','var(--bg)') },
    { label:'VIX (내재변동성)', val: vix != null ? vix.toFixed(2) : '-',
      signal: vix == null ? '-' : vix <= 15 ? sig('낙관과열','var(--orange)','var(--orange-l)') : vix <= 20 ? sig('안정','var(--green)','var(--green-l)') : vix <= 30 ? sig('경계','var(--yellow)','var(--yellow-l)') : sig('공포','var(--red)','var(--red-l)') },
    { label:'Forward ERP', val: erp != null ? (erp*100).toFixed(2)+'%p' : '-',
      signal: erp == null ? '-' : erp < 0.005 ? sig('주식비매력','var(--red)','var(--red-l)') : erp < 0.02 ? sig('중립','var(--text2)','var(--bg)') : sig('주식매력','var(--green)','var(--green-l)') },
    { label:'US 10Y 금리', val: t10 != null ? t10.toFixed(2)+'%' : '-',
      signal: t10 == null ? '-' : t10 >= 4.5 ? sig('채권매력','var(--accent)','var(--accent-l)') : sig('중립','var(--text2)','var(--bg)') },
    { label:'Forward P/E', val: ma.forward_pe != null ? ma.forward_pe.toFixed(1) : '-', signal: '' },
    { label:'Merton w*', val: ma.merton_w_star != null ? ma.merton_w_star.toFixed(1)+'%' : '-', signal: '' },
    { label:'USD/KRW', val: ma.usd_krw != null ? ma.usd_krw.toLocaleString() : '-', signal: '' },
    { label:'Fed Rate', val: ma.fed_rate != null ? ma.fed_rate.toFixed(2)+'%' : '-', signal: '' },
  ];
  var html = '<div style="padding:9px 13px;background:var(--yellow-l);border-radius:7px;margin-bottom:12px;'
    + 'font-size:11px;color:var(--text2);border-left:3px solid var(--yellow)">'
    + 'taa_scorecard.json을 읽지 못해 단일 지표 테이블로 표시 중. GitHub 연결 또는 파이프라인 실행 여부를 확인하세요.</div>'
    + '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">'
    + '<thead><tr style="border-bottom:1px solid var(--border)">'
    + '<th style="text-align:left;padding:7px 10px;font-size:11px;color:var(--text3);font-weight:600">지표</th>'
    + '<th style="text-align:center;padding:7px 10px;font-size:11px;color:var(--text3);font-weight:600">현재값</th>'
    + '<th style="text-align:center;padding:7px 10px;font-size:11px;color:var(--text3);font-weight:600">신호</th>'
    + '</tr></thead><tbody>';
  rows.forEach(function(r, i) {
    html += '<tr style="border-bottom:1px solid var(--border);' + (i % 2 ? 'background:var(--bg)' : '') + '">'
      + '<td style="padding:8px 10px;font-weight:500">' + r.label + '</td>'
      + '<td style="padding:8px 10px;text-align:center;font-weight:700;font-size:14px">' + r.val + '</td>'
      + '<td style="padding:8px 10px;text-align:center">' + (r.signal || '-') + '</td></tr>';
  });
  html += '</tbody></table></div>';
  if (ma.note) html += '<div style="margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text2);line-height:1.7"><b>매크로 메모</b><br>' + ma.note + '</div>';
  el.innerHTML = html;
}
</script>
